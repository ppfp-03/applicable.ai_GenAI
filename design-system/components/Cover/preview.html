<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Applicable.ai</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--canvas); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .brand { fill:var(--brand); }
  .deep { fill:var(--ink); }
  .hl { fill:var(--highlight); }
  .ln { fill:var(--line-control); }
  .lnk { fill:var(--canvas); }
  .blk { rx:var(--radius-lg); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:68px; line-height:.95; font-weight:800; letter-spacing:-.025em; color:var(--ink); }
  .name span { color:var(--brand-ink); }
  .tag { margin:var(--space-3) 0 0 3px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      brand 128×236 slab bled off the top (the tile of the logo) · ink 320×224 "page" bleeding off the right edge · highlight pill 88×32 under the slab — ≈30% of 960×288
  arrangement one tall tangerine slab beside a dark page of text; bottoms aligned space-5 above the edge, space-4 gutter
  pattern     the highlighter, from "evidence is highlighted, never paraphrased": line-control text pills (8 tall, space-5 pitch) on the page, highlight swipes behind two of them
  scales      sides in space-2 multiples; gutter space-4; line pitch space-5; corners radius-lg; pills rx = half height (radius-sm / 4)
-->
<rect class="brand blk" x="24" y="-20" width="128" height="236" rx="20"/>
<rect class="hl" x="24" y="232" width="88" height="32" rx="16"/>
<rect class="deep blk" x="168" y="40" width="336" height="224" rx="20"/>
<rect class="hl" x="188" y="86" width="176" height="22" rx="4" transform="rotate(-2 276 97)"/>
<rect class="hl" x="188" y="158" width="232" height="22" rx="4" transform="rotate(-2 304 169)"/>
<rect class="ln" x="200" y="72" width="224" height="8" rx="4"/>
<rect class="deep" x="200" y="93" width="152" height="8" rx="4"/>
<rect class="ln" x="200" y="120" width="200" height="8" rx="4"/>
<rect class="ln" x="200" y="144" width="240" height="8" rx="4"/>
<rect class="deep" x="200" y="165" width="208" height="8" rx="4"/>
<rect class="ln" x="200" y="192" width="176" height="8" rx="4"/>
<rect class="ln" x="200" y="216" width="120" height="8" rx="4"/>
<rect class="lnk" x="56" y="140" width="64" height="8" rx="4"/>
<rect class="lnk" x="56" y="160" width="40" height="8" rx="4"/>
</svg>
</div>
<div class="words">
<h1 class="name">Applicable<span>.ai</span></h1>
<p class="tag">Apply where it's worth it — and know why.</p>
</div>
</div>
</body>
</html>
