<!-- @dsCard group="Decision" height=110 subtitle="The decision comes first — glyph + word + colour" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>VerdictChip</title>
<style>body{margin:0;padding:24px;background:var(--canvas)}</style></head>
<body>
<div class="aa aa-stack">
  <div class="aa-row">
    <span class="aa-verdict is-go"><i>✓</i>Apply this week</span>
    <span class="aa-verdict is-clarify"><i>?</i>Answer 1 question first</span>
    <span class="aa-verdict is-skip"><i>–</i>Not for now</span>
    <span class="aa-verdict is-closed">Closed</span>
  </div>
  <div class="aa-row">
    <span class="aa-deadline is-soon">⏱ Closes in <b>6 days</b></span>
    <span class="aa-deadline">⏱ Closes in <b>19 days</b></span>
    <span class="aa-tag">Internship · 10 weeks</span>
    <span class="aa-tag">Hybrid</span>
  </div>
</div>
</body></html>
