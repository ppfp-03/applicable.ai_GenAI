<!-- @dsCard group="Clarify" height=440 width=760 subtitle="Before → after, and exactly what moved" -->
<!doctype html>
<html><head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css"><meta charset="utf-8"><title>RecomputeDelta</title>
<style>body{margin:0;padding:24px;background:var(--canvas)}</style></head>
<body>
<div class="aa" style="max-width:680px">
  <div class="aa-delta">
    <div class="aa-row" style="justify-content:space-between;margin-bottom:16px">
      <span class="aa-label" style="color:var(--go)">✓ Updated from your answer · 1.2 s</span><span class="aa-small">German: B2 or higher</span>
    </div>
    <div class="flip">
      <div class="side before"><span class="aa-verdict is-clarify"><i>?</i>Answer first</span><span class="big">74</span><span class="aa-small">Rank #3 · provisional</span></div>
      <span class="arrow">→</span>
      <div class="side after"><span class="aa-verdict is-go"><i>✓</i>Apply</span><span class="big">86</span><span class="aa-small" style="color:var(--ink)">Rank #2 · confirmed</span></div>
    </div>
    <div class="aa-changes">
      <span>Requirement “German B2”</span><span class="to up">To confirm → Met</span>
      <span>Uncertainty penalty</span><span class="to up">−6 → 0</span>
      <span>Also unlocked: Roshe · Basel</span><span class="to up">Answer first → Apply</span>
    </div>
  </div>
</div>
</body></html>
