<!-- @dsCard group="Decision" height=250 subtitle="The number, demoted: secondary, always decomposable" -->
<!doctype html>
<html><head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css"><meta charset="utf-8"><title>PriorityMeter</title>
<style>body{margin:0;padding:24px;background:var(--canvas)}</style></head>
<body>
<div class="aa" style="display:grid;grid-template-columns:auto 320px;gap:48px;align-items:start">
  <div class="aa-stack">
    <div class="aa-meter"><span class="num">92<small>/100</small></span>
      <span class="stack"><span class="f1" style="width:37%"></span><span class="f2" style="width:29%"></span><span class="f3" style="width:18%"></span><span class="f4" style="width:10%"></span></span>
      <span class="cap">Priority · #1 of 24</span></div>
    <div class="aa-meter"><span class="num" style="color:var(--ink-muted)">74<small>/100</small></span>
      <span class="stack"><span class="f1" style="width:32%"></span><span class="f2" style="width:22%"></span><span class="f3" style="width:10%"></span><span class="f4" style="width:10%"></span></span>
      <span class="cap">Provisional</span></div>
  </div>
  <div class="aa-card is-flat" style="padding:16px 18px">
    <div class="aa-label" style="margin-bottom:12px">How 92 is built</div>
    <div class="aa-breakdown">
      <span class="sw" style="background:var(--ink)"></span><span>Fit with your CV · 85% × 40%</span><span class="v">34.0</span>
      <span class="sw" style="background:var(--ink-muted)"></span><span>Fit with your preferences · 90% × 30%</span><span class="v">27.0</span>
      <span class="sw" style="background:var(--brand)"></span><span>Deadline pressure · 82% × 20%</span><span class="v">16.4</span>
      <span class="sw" style="background:var(--line-control)"></span><span>Freshness · 95% × 10%</span><span class="v">9.5</span>
      <span class="sw" style="background:transparent;border:1px dashed var(--clarify)"></span><span>Unconfirmed detail</span><span class="v" style="color:var(--clarify)">−2.0</span>
      <span class="total"><span>Priority</span><span>92</span></span>
    </div>
  </div>
</div>
</body></html>
